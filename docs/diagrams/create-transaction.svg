<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Steps of the create-reservation transaction" direction="ltr" style="direction:ltr;unicode-bidi:isolate">
  <title>Steps of the create-reservation transaction</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="20" y="22" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" text-anchor="start">One database transaction  ·  any failed step rolls everything back</text>
  <rect x="20" y="40" width="164" height="74" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="102.0" y="67.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">1  Lock customer</text>
  <text x="102.0" y="83.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">FOR NO KEY UPDATE</text>
  <text x="102.0" y="98.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">one customer at a time</text>
  <rect x="204" y="40" width="164" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="286.0" y="67.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">2  Idempotency</text>
  <text x="286.0" y="83.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">key already used?</text>
  <text x="286.0" y="98.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">→ return that reservation</text>
  <rect x="388" y="40" width="164" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="470.0" y="75.0" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">3  Region</text>
  <text x="470.0" y="91.0" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">must be ONLINE</text>
  <rect x="572" y="40" width="164" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="654.0" y="67.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">4  Limits</text>
  <text x="654.0" y="83.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">catalog minimum ·</text>
  <text x="654.0" y="98.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">contract vs. current usage</text>
  <path d="M 184 77.0 L 202 77.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 368 77.0 L 386 77.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 552 77.0 L 570 77.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 654.0 114 L 654.0 146 L 130 146 L 130 176" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="178" width="220" height="74" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="130.0" y="205.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">5  Reserve capacity</text>
  <text x="130.0" y="221.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">one conditional UPDATE per item,</text>
  <text x="130.0" y="236.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">items sorted by resource id</text>
  <rect x="280" y="178" width="220" height="74" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="390.0" y="205.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">6  Store</text>
  <text x="390.0" y="221.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">reservation (RESERVED) · items</text>
  <text x="390.0" y="236.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">· audit row</text>
  <rect x="540" y="178" width="196" height="74" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="638.0" y="205.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">7  COMMIT</text>
  <text x="638.0" y="221.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">all effects visible</text>
  <text x="638.0" y="236.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">at once</text>
  <path d="M 240 215.0 L 278 215.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 500 215.0 L 538 215.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="284" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">Step 5:  UPDATE … SET reserved = reserved + n  WHERE available &gt;= n   →  0 rows changed means not enough capacity</text>
</svg>
