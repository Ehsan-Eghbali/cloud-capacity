<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Reservation lifecycle" direction="ltr" style="direction:ltr;unicode-bidi:isolate">
  <title>Reservation lifecycle</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>
  <circle cx="26" cy="150" r="7" fill="#0f172a"/>
  <rect x="70" y="115" width="160" height="70" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="150.0" y="140.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Check request</text>
  <text x="150.0" y="156.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">contract limits</text>
  <text x="150.0" y="171.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">· region capacity</text>
  <rect x="315" y="115" width="160" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="395.0" y="140.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">RESERVED</text>
  <text x="395.0" y="156.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">reserved += n</text>
  <text x="395.0" y="171.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">held until expires_at</text>
  <rect x="315" y="252" width="160" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="395.0" y="273.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Refused</text>
  <text x="395.0" y="289.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">error with the reason</text>
  <text x="395.0" y="304.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">nothing stored or held</text>
  <rect x="590" y="22" width="156" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="668.0" y="45.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">COMMITTED</text>
  <text x="668.0" y="61.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">reserved −= n</text>
  <text x="668.0" y="76.5" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">allocated += n</text>
  <rect x="590" y="117" width="156" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="668.0" y="148.0" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">CANCELLED</text>
  <text x="668.0" y="164.0" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">reserved −= n</text>
  <rect x="590" y="212" width="156" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="668.0" y="243.0" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">EXPIRED</text>
  <text x="668.0" y="259.0" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">reserved −= n</text>
  <path d="M 33 150 L 68 150" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 230 150 L 313 150" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="272" y="141" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">all rules pass</text>
  <path d="M 150 185 L 150 283 L 313 283" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="232" y="274" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">a rule fails</text>
  <path d="M 475 132 L 530 132 L 530 55 L 588 55" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="522" y="100" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="end">commit before deadline</text>
  <path d="M 475 150 L 588 150" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="562" y="143" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">cancel</text>
  <path d="M 475 168 L 530 168 L 530 245 L 588 245" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="522" y="208" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="end">deadline passed</text>
  <text x="522" y="222" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="end">(sweeper)</text>
  <text x="380" y="332" font-family="Vazirmatn, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">COMMITTED, CANCELLED and EXPIRED are final.  n = requested amount of each resource.</text>
</svg>
