services:
  postgres:
    image: postgres:16.9-alpine
    container_name: cloud_allocator_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloud_capacity
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloud_capacity"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    container_name: cloud_allocator_app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "password"
      DB_NAME: "cloud_capacity"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "./server migrate up && ./server seed && ./server server"]

volumes:
  pgdata:
